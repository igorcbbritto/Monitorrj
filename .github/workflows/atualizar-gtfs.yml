name: Atualizar cache GTFS

on:
  push:
    branches: [main]
    paths-ignore:
      - gtfs-cache.json
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Baixar GTFS oficial
        run: |
          set -e
          mkdir -p /tmp/gtfs

          # Fonte oficial da SMTR. O ArcGIS está respondendo 403 no runner do GitHub,
          # então usamos o espelho da MobilityDatabase como fallback.
          if curl -fL --retry 4 --retry-delay 5 --connect-timeout 30 --max-time 300 \
            "https://www.arcgis.com/sharing/rest/content/items/8ffe62ad3b2f42e49814bf941654ea6c/data" \
            -o /tmp/gtfs/oficial.zip; then
            echo "GTFS baixado diretamente da fonte da SMTR."
          else
            echo "ArcGIS indisponível para o runner. Usando espelho da MobilityDatabase."
            curl -fL --retry 4 --retry-delay 5 --connect-timeout 30 --max-time 300 \
              "https://files.mobilitydatabase.org/mdb-1791/mdb-1791-202608080056/mdb-1791-202608080056.zip" \
              -o /tmp/gtfs/oficial.zip
          fi

          unzip -t /tmp/gtfs/oficial.zip >/dev/null

      - name: Gerar cache compacto
        run: python scripts/build_gtfs_cache.py /tmp/gtfs/oficial.zip gtfs-cache.json

      - name: Publicar cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gtfs-cache.json
          if git diff --cached --quiet; then
            echo "GTFS sem alterações."
          else
            git commit -m "chore: atualizar cache GTFS"
            git push
          fi
