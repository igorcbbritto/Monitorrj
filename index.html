<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor de Ônibus</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div>
    <h1>🚌 Monitor de Ônibus</h1>
    <p>Rio de Janeiro · dados oficiais</p>
  </div>
  <span id="status" class="status">Pronto</span>
</header>

<main class="layout">
  <aside class="panel">
    <label for="search">Pesquisar linha</label>
    <div class="search">
      <input id="search" placeholder="Ex.: 755D" autocomplete="off">
      <button id="searchBtn">Buscar</button>
    </div>

    <h2>Linhas</h2>
    <div id="routes" class="routes"></div>

    <section id="details" class="details hidden">
      <h2 id="routeTitle"></h2>
      <p id="routeDirection"></p>
      <div id="routeActions" class="route-actions hidden">
        <button id="trafficBtn" type="button">🚦 Ver trânsito</button>
        <button id="directionsBtn" type="button">🧭 Rota no Maps</button>
      </div>
      <div id="vehicles" class="vehicles"></div>
      <div class="refresh">Atualização automática: <b id="countdown">60</b>s</div>
    </section>
  </aside>

  <section class="map-area">
    <div id="map"></div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>
<script src="app.js"></script>
</body>
</html>
